name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          # Best-effort x86_64 coverage until the formula is validated on real Intel hardware.
          - os: macos-15-intel
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      # Not a uv.toml setting: the Homebrew formula passes an explicit --python to
      # `uv sync`, which only-managed would reject. In CI we want uv's standalone
      # build, because this project loads sqlite-vec through
      # sqlite3.enable_load_extension and the runner's system SQLite on macOS is
      # compiled without extension support. A bare "cpython-3.12" request is not
      # enough on its own: uv still prefers a discovered system interpreter.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "cpython-3.12"
          cache-python: "true"
      - name: Require SQLite extension loading
        run: |
          uv run --frozen python - <<'PY'
          import platform, sqlite3, sys
          print(f"{sys.version.split()[0]} {platform.machine()} "
                f"sqlite {sqlite3.sqlite_version}")
          if not hasattr(sqlite3.connect(":memory:"), "enable_load_extension"):
              raise SystemExit("This interpreter cannot load SQLite extensions; "
                               "sqlite-vec is required for search.")
          PY
      - run: uv sync --frozen --extra dev
      - name: Install Clothesline so the v5 split regression test runs
        run: uv pip install --python .venv/bin/python "clothesline @ git+https://github.com/kplawver/clothesline.git"
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          retention-days: 7

  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Claude Code plugin and marketplace manifests
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate plugins/setauket --strict
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Audit the generic .agents layout with Tallmadge
        run: |
          git clone --depth 1 https://github.com/kplawver/tallmadge.git /tmp/tallmadge
          cd /tmp/tallmadge
          bundle install --quiet
          bin/clpr repo check "$GITHUB_WORKSPACE"
      - name: Syntax-check the OMP TypeScript extension
        uses: oven-sh/setup-bun@v2
      - run: bun build integrations/omp/extensions/setauket.ts --target=bun --outfile=/tmp/setauket-omp-check.js