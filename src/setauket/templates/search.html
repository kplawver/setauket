{% extends 'base.html' %}{% block body %}<h1>Search memory</h1><form action="/search" method="get"><label>Words or phrase<input name="q" value="{{ query }}" maxlength="2000" required></label><label>Project key<input name="project" value="{{ project }}"></label><label>Collection<select name="category"><option value="">All</option>{% for value in ['hot','cold','memory'] %}<option value="{{ value }}" {% if category == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label><button type="submit">Search</button></form>
{% for row in results %}<article class="card"><small>{{ row.category }} · {{ row.project_key or 'Global' }} · {{ row.created_at|date }}</small><p><a href="/{{ 'memories' if row.category == 'memory' else 'sessions' }}/{{ row.source_id if row.category == 'memory' else row.session_id }}">{{ row.content[:300] }}</a></p></article>{% else %}{% if query %}<p>No matches.</p>{% endif %}{% endfor %}{% endblock %}
