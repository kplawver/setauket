[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "setauket"
version = "0.8.0"
description = "Local cross-harness context storage for coding agents"
license = "MIT"
# Capped below 3.14: from 3.14 on, fastembed demands onnxruntime>=1.24.2, which has no
# macOS x86_64 wheel at any version. The Homebrew formula pins python@3.12 regardless.
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp>=2.2,<3",
  "starlette>=0.46,<2",
  "uvicorn>=0.34,<1",
  "jinja2>=3.1,<4",
  "sqlite-vec>=0.1.9,<1",
  "fastembed>=0.8,<1",
  "huggingface-hub>=1,<2",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.16"]

[project.scripts]
setauket = "setauket.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/setauket"]

[tool.uv]
# onnxruntime, pulled in by fastembed, has published no macOS x86_64 wheel since
# 1.23.2. Resolving against this environment keeps an installable version pinned for
# every platform, so the lockfile is usable on Intel Macs.
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]