[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "setauket"
version = "0.7.0"
description = "Local cross-harness context storage for coding agents"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.2,<3",
  "starlette>=0.46,<2",
  "uvicorn>=0.34,<1",
  "jinja2>=3.1,<4",
  "sqlite-vec>=0.1.9,<1",
  "fastembed>=0.8,<1",
  "huggingface-hub>=1,<2",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.16"]

[project.scripts]
setauket = "setauket.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/setauket"]

[tool.pytest.ini_options]
testpaths = ["tests"]